<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Peloton Grand Tour: Maillot Jaune</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0e1220;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      color: #f8faff;
    }
    #loading {
      position: absolute;
      text-align: center;
      letter-spacing: 0.08em;
      font-weight: 700;
      color: #ffd830;
    }
  </style>
</head>
<body>
  <div id="loading">LOADING PELOTON GRAND TOUR: MAILLOT JAUNE...</div>
  <script src="wasm_exec.js"></script>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("game.wasm"), go.importObject).then(result => {
      const loader = document.getElementById("loading");
      if (loader) loader.remove();
      go.run(result.instance);
    }).catch(err => {
      console.error("Failed to load game.wasm:", err);
      const loader = document.getElementById("loading");
      if (loader) loader.textContent = "ERROR LOADING GAME.WASM: " + err;
    });
  </script>
</body>
</html>
